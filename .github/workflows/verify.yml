name: Verify formalization

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lean build and fail-closed audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Lean and independently check compiled environment
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: true
          build-args: "ConstitutionalParole"
          leanchecker: true
          leanchecker-args: "ConstitutionalParole"
          use-github-cache: false
          use-mathlib-cache: false

      - name: Verify source, theorem inventory, and legal-claim ledger
        run: node checks/integrity.mjs

      - name: Verify exact theorem dependencies
        run: node checks/dependency-audit.mjs

      - name: Confirm pinned toolchain
        run: test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
