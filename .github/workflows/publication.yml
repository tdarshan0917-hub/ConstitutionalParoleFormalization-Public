name: Verify public preprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Publication consistency and disclosure scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check manuscript and claim consistency
        run: node checks/publication-consistency.mjs

      - name: Check public disclosure tree
        run: node checks/public-tree-scan.mjs

      - name: Validate Zenodo metadata JSON
        run: node -e "JSON.parse(require('fs').readFileSync('publication/zenodo_metadata.json', 'utf8'))"
